<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open 2 tabs · close self</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #111;
        }
        .box {
            max-width: 480px;
            width: 100%;
            border: 1px solid #d0d7de;
            border-radius: 12px;
            padding: 2rem 1.8rem;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        h1 {
            font-weight: 500;
            font-size: 1.6rem;
            letter-spacing: -0.01em;
            margin-bottom: 0.3rem;
            color: #0d1117;
        }
        .sub {
            color: #4a5568;
            font-size: 0.95rem;
            border-bottom: 1px solid #eaeef2;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        .info-row {
            background: #f6f8fa;
            border-radius: 8px;
            padding: 0.9rem 1.2rem;
            margin: 1.2rem 0 1.5rem 0;
            font-size: 0.95rem;
            border: 1px solid #e1e4e8;
        }
        .info-row .url-line {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0;
        }
        .info-row .badge {
            background: #d0d7de;
            color: #1f2937;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.1rem 0.7rem;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .info-row .url {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            color: #0d1117;
            word-break: break-all;
        }
        .perm-box {
            background: #f0f4f9;
            border-radius: 8px;
            padding: 0.9rem 1.2rem;
            margin: 1.2rem 0 1.8rem 0;
            border-left: 4px solid #2d7aff;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .perm-box .label {
            color: #1f2a3a;
        }
        .perm-box .perm-status {
            background: #d0d7de;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1f2937;
        }
        .perm-box .perm-status.granted {
            background: #d4edda;
            color: #0b5e2e;
        }
        .btn {
            background: #f0f4f9;
            border: 1px solid #d0d7de;
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 500;
            color: #0d1117;
            cursor: pointer;
            transition: 0.1s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: #eef2f6;
        }
        .btn:hover {
            background: #e1e6ed;
            border-color: #b0b9c4;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
            transform: none;
        }
        .btn-primary {
            background: #2d7aff;
            border-color: #2d7aff;
            color: white;
        }
        .btn-primary:hover {
            background: #1c6ae8;
            border-color: #1c6ae8;
        }
        .btn-primary:disabled {
            background: #8bb0f5;
            border-color: #8bb0f5;
        }
        .footnote {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #5a6a7a;
            border-top: 1px solid #eaeef2;
            padding-top: 1rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .footnote span {
            background: #f1f4f8;
            padding: 0.1rem 0.7rem;
            border-radius: 30px;
        }
        .msg {
            font-size: 0.9rem;
            margin: 0.8rem 0 0 0;
            padding: 0.4rem 0.2rem;
            min-height: 1.8rem;
            color: #1f2a3a;
        }
        .msg.error {
            color: #b33636;
        }
        .msg.success {
            color: #0e6b2f;
        }
        hr {
            border: none;
            border-top: 1px solid #e1e6ed;
            margin: 0.8rem 0;
        }
        .hidden-url {
            display: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>open 2 tabs</h1>
        <div class="sub">then close this window</div>

        <div class="info-row">
            <div class="url-line">
                <span class="badge">1</span>
                <span class="url">youtube results</span>
            </div>
            <div class="url-line">
                <span class="badge">2</span>
                <span class="url">python docs</span>
            </div>
        </div>

        <div class="perm-box" id="permBox">
            <span class="label">popup permission</span>
            <span class="perm-status" id="permStatus">checking</span>
        </div>

        <button class="btn btn-primary" id="launchBtn" disabled>
            <span></span> open tabs & close
        </button>

        <div id="message" class="msg">click to request permission first</div>

        <hr />

        <div class="footnote">
            <span>window.close()</span>
            <span>may be blocked</span>
        </div>
    </div>

    <script>
        (function() {
            var launchBtn = document.getElementById('launchBtn');
            var msgEl = document.getElementById('message');
            var permStatus = document.getElementById('permStatus');

            var TABS = [
                'https://www.youtube.com/results?search_query=python+tutorials',
                'https://docs.python.org/3/'
            ];

            function setMsg(text, type) {
                msgEl.textContent = text;
                msgEl.className = 'msg';
                if (type) msgEl.classList.add(type);
            }

            function setPermStatus(text, granted) {
                permStatus.textContent = text;
                permStatus.className = 'perm-status';
                if (granted) permStatus.classList.add('granted');
            }

            function checkPopupPermission() {
                return new Promise(function(resolve) {
                    try {
                        var testWin = window.open('about:blank', '_blank', 'width=1,height=1');
                        if (testWin === null) {
                            setPermStatus('blocked', false);
                            resolve(false);
                            return;
                        }
                        try {
                            testWin.close();
                        } catch (e) {}
                        setPermStatus('granted', true);
                        resolve(true);
                    } catch (e) {
                        setPermStatus('blocked', false);
                        resolve(false);
                    }
                });
            }

            function requestPopupPermission() {
                return new Promise(function(resolve) {
                    try {
                        var testWin = window.open('about:blank', '_blank', 'width=1,height=1');
                        if (testWin === null) {
                            setPermStatus('blocked', false);
                            resolve(false);
                            return;
                        }
                        try {
                            testWin.close();
                        } catch (e) {}
                        setPermStatus('granted', true);
                        resolve(true);
                    } catch (e) {
                        setPermStatus('blocked', false);
                        resolve(false);
                    }
                });
            }

            function launchAndClose() {
                launchBtn.disabled = true;
                launchBtn.textContent = 'opening...';
                setMsg('opening tabs ...');

                var opened = 0;
                var blocked = false;

                for (var i = 0; i < TABS.length; i++) {
                    try {
                        var newTab = window.open(TABS[i], '_blank');
                        if (newTab === null) {
                            blocked = true;
                        } else {
                            opened++;
                        }
                    } catch (e) {
                        blocked = true;
                    }
                }

                setTimeout(function() {
                    if (opened === 0 && blocked) {
                        setMsg('both tabs blocked - cannot close', 'error');
                        launchBtn.disabled = false;
                        launchBtn.textContent = 'retry';
                        return;
                    }

                    if (opened === 1) {
                        setMsg('only 1 tab opened (1 blocked) - closing now', 'error');
                    } else {
                        setMsg(opened + ' tabs opened - closing window', 'success');
                    }

                    try {
                        window.close();
                        var safetyTimer = setTimeout(function() {
                            setMsg('window still open (close blocked by browser)', 'error');
                            launchBtn.disabled = false;
                            launchBtn.textContent = 'retry';
                        }, 400);

                        window.__safetyTimer = safetyTimer;

                        window.addEventListener('beforeunload', function clearTimer() {
                            if (window.__safetyTimer) {
                                clearTimeout(window.__safetyTimer);
                                window.__safetyTimer = null;
                            }
                            window.removeEventListener('beforeunload', clearTimer);
                        });

                    } catch (closeErr) {
                        setMsg('cannot close: browser restriction', 'error');
                        launchBtn.disabled = false;
                        launchBtn.textContent = 'retry';
                    }
                }, 250);
            }

            async function init() {
                var hasPerm = await checkPopupPermission();
                if (hasPerm) {
                    setPermStatus('granted', true);
                    launchBtn.disabled = false;
                    setMsg('permission granted - click to open tabs', 'success');
                } else {
                    setPermStatus('blocked', false);
                    launchBtn.disabled = false;
                    launchBtn.textContent = 'request permission';
                    setMsg('click to request popup permission', '');
                }
            }

            launchBtn.addEventListener('click', async function(e) {
                e.preventDefault();

                if (launchBtn.disabled) return;

                var isGranted = permStatus.classList.contains('granted');

                if (!isGranted) {
                    setMsg('requesting permission ...');
                    launchBtn.disabled = true;
                    var granted = await requestPopupPermission();
                    launchBtn.disabled = false;

                    if (granted) {
                        setPermStatus('granted', true);
                        setMsg('permission granted - click again to open tabs', 'success');
                        launchBtn.textContent = 'open tabs & close';
                    } else {
                        setPermStatus('blocked', false);
                        setMsg('permission denied - check browser settings', 'error');
                        launchBtn.textContent = 'request permission';
                    }
                    return;
                }

                launchAndClose();
            });

            init();
        })();
    </script>
</body>
</html>
